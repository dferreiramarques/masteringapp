name: pages

# Site estático do GitHub Pages:
#   https://dferreiramarques.github.io/masteringapp/            → página de produto
#   https://dferreiramarques.github.io/masteringapp/app/        → UI da app (thin client
#                                                                  do backend local 127.0.0.1:7860)
# O backend FastAPI (DSP) NÃO corre no Pages — a /app/ deteta e liga-se
# automaticamente ao MasteringApp.exe/portable a correr no teu PC (CORS já
# tratado no app.py). Depois do 1.º push: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar site estático
        run: |
          python3 build_site.py site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
